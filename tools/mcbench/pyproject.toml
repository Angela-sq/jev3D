[project]
name = "mcbench"
version = "0.1.0"
description = "Minecraft benchmark that scores how well a model controls a player from pixels alone"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=13.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.scripts]
mcbench = "mcbench.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcbench"]

[tool.pytest.ini_options]
testpaths = ["tests"]

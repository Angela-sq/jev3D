id: explore_behind
category: exploration
difficulty: 2
goal_text: Find the diamond block pillar somewhere around you and stand next to it.
time_limit_s: 60
params:
  t: {polar: {dist: [9, 13], angle: [120, 240]}}
setup_commands:
  - /fill ~{t_dx} ~ ~{t_dz} ~{t_dx} ~6 ~{t_dz} minecraft:diamond_block
success:
  - {near: ["{t_dx}", 0, "{t_dz}"], radius: 2.5}
dev_seeds: [681, 682, 683]
heldout_seeds: [1031, 1032]
heldout_variant:
  params:
    t: {polar: {dist: [10, 14], angle: [70, 290]}}
  setup_commands:
    - /fill ~{t_dx} ~ ~{t_dz} ~{t_dx} ~6 ~{t_dz} minecraft:diamond_block
    - /fill ~-1 ~ ~6 ~1 ~5 ~6 minecraft:diamond_ore
oracle:
  commands: ["/tp @s ~{t_dx} ~7 ~{t_dz}"]
